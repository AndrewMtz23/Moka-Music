name: GitHub Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check app tests tools

      - name: Format check
        run: ruff format app tests tools --check

      - name: Tests
        run: python -m unittest discover -s tests -p "test*.py"

      - name: Build Windows executable
        run: pyinstaller MokaMusic.spec --noconfirm --clean

      - name: Package release
        run: Compress-Archive -Path dist\MokaMusic -DestinationPath "MokaMusic-${{ github.ref_name }}-windows.zip" -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: MokaMusic-${{ github.ref_name }}-windows.zip
          tag_name: ${{ github.ref_name }}
          name: MokaMusic ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
